apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  labels:
    app.kubernetes.io/name: aws-ecommerce
data:
  APP_ENV: "production"
  DB_HOST: "mysql-service"
  DB_NAME: "ecommerce_db"
  DB_PORT: "3306"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  labels:
    app.kubernetes.io/name: aws-ecommerce
type: Opaque
stringData:
  DB_USER: "ecommerce_user"
  DB_PASSWORD: "YourStrongPassword123!"
  MYSQL_ROOT_PASSWORD: "RootPassword123!"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  labels:
    app.kubernetes.io/name: aws-ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: aws-ecommerce
    app: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app.kubernetes.io/name: aws-ecommerce
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-app
  labels:
    app.kubernetes.io/name: aws-ecommerce
    app: ecommerce-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
    spec:
      containers:
        - name: web
          image: aws-ecommerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-service
  labels:
    app.kubernetes.io/name: aws-ecommerce
spec:
  type: NodePort
  selector:
    app: ecommerce-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
